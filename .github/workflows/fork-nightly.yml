name: Fork Desktop Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the source matches the last published nightly
        type: boolean
        default: false

concurrency:
  group: fork-windows-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'muffe/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      build: ${{ steps.sync.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.FORK_SYNC_SSH_KEY }}

      - name: Merge upstream and select build
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main
          if ! git merge --no-ff -m "Merge upstream main [skip ci]" FETCH_HEAD; then
            git merge --abort
            echo "::error::Upstream conflicts with this fork. Resolve the merge locally and rerun this workflow."
            exit 1
          fi
          git push origin HEAD:main
          # Fork releases do not use upstream's hosted runners or publishers.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate --jq '.workflows[] | select(.path != ".github/workflows/fork-nightly.yml" and .state == "active") | .id' |
            while read -r workflow_id; do
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/disable"
            done
          sha="$(git rev-parse HEAD)"
          last_sha="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.prerelease and (.draft | not) and (.tag_name | contains("-nightly.")))][0].target_commitish // ""')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE_BUILD" == "true" || "$sha" != "$last_sha" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "The latest nightly already contains $sha." >> "$GITHUB_STEP_SUMMARY"
          fi

  wsl:
    name: Build WSL terminal helper
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Set nightly version
        id: version
        shell: bash
        env:
          BUILD_SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" --run-number "$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))" --sha "$BUILD_SHA" --github-output

      - name: Build Linux node-pty
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: [process.cwd() + '/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node

      - uses: actions/upload-artifact@v7
        with:
          name: fork-wsl-node-pty
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows x64
    needs: [sync, wsl]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer failed: $($proc.ExitCode)"
          }

      - uses: actions/download-artifact@v8
        with:
          name: fork-wsl-node-pty
          path: wsl-prebuild

      - name: Align package versions
        env:
          BUILD_VERSION: ${{ needs.wsl.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$env:BUILD_VERSION"

      - name: Build installer and update metadata
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.wsl.outputs.version }}
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$env:BUILD_VERSION" --wsl-prebuild wsl-prebuild/pty.node --verbose

      - name: Verify update assets
        shell: pwsh
        run: |
          if (!(Test-Path release/nightly.yml)) { throw "Missing nightly.yml update feed" }
          if (!(Get-ChildItem release/*.exe)) { throw "Missing Windows installer" }
          if (!(Get-ChildItem release/*.blockmap)) { throw "Missing differential update blockmap" }

      - uses: actions/upload-artifact@v7
        with:
          name: fork-windows-nightly
          path: |
            release/*.exe
            release/*.blockmap
            release/nightly.yml
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS Apple Silicon
    needs: [sync, wsl]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      T3CODE_FORK_MAC_SIGNING_IDENTITY: T3 Code Fork
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Import persistent fork certificate
        timeout-minutes: 2
        env:
          CERTIFICATE: ${{ secrets.FORK_MAC_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.FORK_MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          export T3CODE_FORK_MAC_SIGNING_KEYCHAIN="$RUNNER_TEMP/fork-signing.keychain-db"
          echo "T3CODE_FORK_MAC_SIGNING_KEYCHAIN=$T3CODE_FORK_MAC_SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          certificate_path="$RUNNER_TEMP/fork-signing.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -k "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN" -T /usr/bin/codesign
          security list-keychains -d user -s "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-certificate -c "$T3CODE_FORK_MAC_SIGNING_IDENTITY" -p "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN" > "$RUNNER_TEMP/fork-signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN" "$RUNNER_TEMP/fork-signing.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN"
          rm "$certificate_path"

      - name: Verify native update between two self-signed versions
        run: node scripts/test-fork-macos-update.mjs

      - name: Align package versions
        env:
          BUILD_VERSION: ${{ needs.wsl.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$BUILD_VERSION"

      - name: Build signed installer and update metadata
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.wsl.outputs.version }}
        run: vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$BUILD_VERSION" --verbose

      - name: Verify packaged signature and update assets
        run: |
          set -euo pipefail
          test -f release/nightly-mac.yml
          mkdir "$RUNNER_TEMP/fork-packaged"
          ditto -x -k release/*-arm64.zip "$RUNNER_TEMP/fork-packaged"
          codesign --verify --deep --strict --all-architectures "$RUNNER_TEMP/fork-packaged/"*.app
          codesign -d -r- "$RUNNER_TEMP/fork-packaged/"*.app
          ls release/*-arm64.dmg release/*-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: fork-macos-nightly
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/nightly-mac.yml
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$T3CODE_FORK_MAC_SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/fork-signing.p12"

  publish:
    name: Publish fork nightly
    needs: [sync, wsl, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fork-*-nightly
          merge-multiple: true
          path: release

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.wsl.outputs.tag }}
          RELEASE_VERSION: ${{ needs.wsl.outputs.version }}
          BUILD_SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          # A draft keeps the updater from seeing a partially uploaded release.
          gh release create "$RELEASE_TAG" --draft --prerelease --latest=false --target "$BUILD_SHA" --title "T3 Code Fork Nightly $RELEASE_VERSION" --notes "Windows x64 and macOS arm64 build of $GH_REPO at $BUILD_SHA. Includes this fork's customizations. Windows installer is unsigned. macOS is self-signed and not notarized."
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Nightly: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
